name: Video Takes

# Experimental: answers YouTube links sent to the Telegram bot with facts and
# draft X posts built from the video's transcript. See VIDEO_TAKES.md.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "poll / fetch-test / analyze / send"
        default: fetch-test
        type: choice
        options: [poll, fetch-test, analyze, send]
      url:
        description: "YouTube link (for fetch-test, analyze and send)"
        required: false
        default: ""
  # Check for new links after each news run (about every 30 minutes).
  workflow_run:
    workflows: [AGI Pulse NewsBot]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "47 * * * *"  # best-effort hourly fallback

permissions:
  contents: write

concurrency:
  group: telegram-videos
  cancel-in-progress: false

jobs:
  takes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-video-takes.txt
      - name: Run video takes
        id: takes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TAKES_BOT_TOKEN: ${{ secrets.TELEGRAM_TAKES_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_FEEDBACK_USER_ID: ${{ secrets.TELEGRAM_FEEDBACK_USER_ID }}
          VIDEO_TAKES_GEMINI_MODEL: ${{ vars.VIDEO_TAKES_GEMINI_MODEL }}
          RUN_MODE: ${{ github.event.inputs.mode || 'poll' }}
          VIDEO_URL: ${{ github.event.inputs.url }}
        run: |
          if [ "$RUN_MODE" = "poll" ]; then
            python video_takes.py --mode poll
          else
            python video_takes.py --mode "$RUN_MODE" --url "$VIDEO_URL"
          fi
      - name: Save state
        if: ${{ !cancelled() && (github.event.inputs.mode || 'poll') == 'poll' }}
        run: |
          if [ -f state/video_takes.json ]; then
            git config user.name "agi-pulse-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/video_takes.json
            if [ -f state/videos.json ]; then git add state/videos.json; fi
            if ! git diff --cached --quiet; then
              git commit -m "video takes: update state [skip ci]"
              git pull --rebase --quiet origin main
              git push origin HEAD:main
            fi
          fi
