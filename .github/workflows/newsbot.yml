name: AGI Pulse NewsBot

on:
  # Runs are started every 30 min (:07 and :37) by an outside timer on cron-job.org
  # through the API below; GitHub's own schedule skipped most runs.
  workflow_dispatch:          # cron-job.org timer + "Run workflow" button
    inputs:
      # A detail pack for one link is its own workflow now: telegram.yml.
      mode:
        description: "normal / dry-run / check-feeds / inspect-candidates"
        default: normal
        type: choice
        options: [normal, dry-run, check-feeds, inspect-candidates]

permissions:
  contents: write   # lets the bot save state/state.json back to the repo

concurrency:
  group: newsbot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        id: run_bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          case "${{ github.event.inputs.mode }}" in
            dry-run)     python newsbot.py --dry-run ;;
            check-feeds) python newsbot.py --check-feeds ;;
            inspect-candidates) python newsbot.py --inspect-candidates ;;
            *)           python newsbot.py ;;
          esac

      - name: Detail packs for official stories
        # Follow-ups for drafts just delivered from official sources (ARTICLE_DETAILS.md).
        # A failure here must not stop the state from being saved or fail the news run.
        if: ${{ !cancelled() && steps.run_bot.outcome != 'skipped' && (github.event.inputs.mode == 'normal' || github.event.inputs.mode == '') }}
        continue-on-error: true
        # Room to wait out a busy Gemini and retry in this run (article_details.py
        # RETRY_WAITS), but never let a slow pack keep the state from being saved.
        timeout-minutes: 9
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python article_details.py --queue

      - name: Save state
        # Keep queued drafts and successful deliveries even if a later send fails.
        if: ${{ !cancelled() && steps.run_bot.outcome != 'skipped' && (github.event.inputs.mode == 'normal' || github.event.inputs.mode == '') }}
        run: |
          git config user.name  "agi-pulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/state.json
          if git diff --cached --quiet; then
            echo "no state change"
          else
            git commit -m "newsbot: update state [skip ci]"
            git pull --rebase --quiet
            git push
          fi
