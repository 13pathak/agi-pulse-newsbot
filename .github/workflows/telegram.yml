name: Telegram requests

# Started the moment a message reaches the Telegram bot, by the relay in
# relay/worker.js (setup: ARTICLE_DETAILS.md). Independent of the half-hourly
# news run: no shared concurrency group, so a request never waits behind it.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Article link: sends a detail pack to Telegram"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  details:
    if: ${{ inputs.url != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Send detail pack
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}   # optional: fallback when Gemini is busy
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          DETAILS_URL: ${{ inputs.url }}
        run: python article_details.py --url "$DETAILS_URL"
