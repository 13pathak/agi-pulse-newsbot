name: Practical AI Videos

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check-config / inspect / dry-run / normal"
        default: dry-run
        type: choice
        options: [check-config, inspect, dry-run, normal]
  # Follow the existing outside timer; this does not change the X-news workflow.
  workflow_run:
    workflows: [AGI Pulse NewsBot]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "17 * * * *"  # best-effort fallback, plus feedback polling

permissions:
  contents: write

concurrency:
  group: telegram-videos
  cancel-in-progress: false

jobs:
  recommend:
    if: github.event_name == 'workflow_dispatch' || vars.YOUTUBE_RECOMMENDATIONS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run recommender
        id: recommender
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_FEEDBACK_USER_ID: ${{ secrets.TELEGRAM_FEEDBACK_USER_ID }}
          VIDEO_GEMINI_MODEL: ${{ vars.VIDEO_GEMINI_MODEL }}
          RUN_MODE: ${{ github.event.inputs.mode || 'normal' }}
        run: python video_recommender.py --mode "$RUN_MODE" --report artifacts/video-review.json
      - name: Save video state
        if: ${{ !cancelled() && steps.recommender.outcome != 'skipped' && (github.event.inputs.mode == 'normal' || github.event.inputs.mode == '') }}
        run: |
          if [ -f state/videos.json ]; then
            git config user.name "agi-pulse-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # video_feedback holds votes relayed from Telegram; the run removes the ones it applied
            git add -A state/videos.json $([ -d state/video_feedback ] && echo state/video_feedback)
            if ! git diff --cached --quiet; then
              git commit -m "videos: update recommendations and feedback [skip ci]"
              git pull --rebase --quiet origin main
              git push origin HEAD:main
            fi
          fi
      - name: Keep preview report
        if: ${{ !cancelled() && (github.event.inputs.mode == 'dry-run' || github.event.inputs.mode == 'inspect') }}
        uses: actions/upload-artifact@v4
        with:
          name: video-review
          path: artifacts/video-review.json
          if-no-files-found: ignore
          retention-days: 7
