# ─────────────────────────────────────────────────────────────
#  AGI Pulse NewsBot — settings you can tweak without touching code
# ─────────────────────────────────────────────────────────────

settings:
  max_drafts_per_run: 1        # 1 draft per run (every 30 min) gives you time to review
  max_drafts_per_day: 0        # 0 = no daily limit; set a number (e.g. 10) to cap drafts per day
  min_importance: 7            # 1–10; Gemini scores every story, below this is ignored (was 5: fewer, bigger stories)
  details_min_importance: 7    # official-source stories at or above this also get a detail pack (remove to turn off)
  details_max_per_day: 6       # automatic detail packs per IST day (each has 5 drafts)
  takes_for_all_stories: true  # every other delivered story gets 3 opinion takes written from its full article
  takes_max_per_day: 30        # cap on those takes messages per IST day
  takes_judge: true            # second Gemini request (decision_model below) picks the best drafts (false = skip it)
  # takes_voice: |            # optional: replace the built-in writing voice for detail-pack drafts
  #   (see DEFAULT_VOICE in article_details.py for the current wording)
  lookback_hours: 24           # ignore articles older than this (a full day, so slow nights still have stories)
  max_pending_stories: 40      # durable queue of qualifying, unsent stories
  breaking_window_hours: 6     # urgency boost fades after 6h, disappears after 12h
  waiting_boost_hours: 12      # reach the capped +0.75 waiting boost after 12h
  story_ttl_hours:             # expire from publication time, or discovery if undated
    news: 36
    primary: 48
    research: 96
    policy: 72
    paper: 96
    model: 168
  max_candidates: 60           # hard item limit, shared by every source type
  max_prompt_chars: 48000       # hard limit for the COMPLETE Gemini prompt, including history
  max_candidates_per_source: 3  # prevents one busy feed from dominating; sources can override
  candidate_slots:              # reserved slots; unused slots go to higher-priority categories
    primary: 24                # direct lab/company announcements
    research: 8                # evaluations and research blogs
    policy: 4                  # official government announcements
    model: 4                   # trending open-model releases
    paper: 4                   # community-selected papers
    news: 16                   # preserve room for original reporting
  max_summary_fetches: 12       # enrich only shortlisted items, never crawl an entire RSS archive
  fetch_workers: 6              # bounded concurrent source fetches; no extra Gemini calls
  quiet_hours_ist: ["23:00", "06:30"]   # no drafts during these hours (IST); backlog arrives in the morning
  show_source: false           # true = end posts with "via <Outlet>"
  include_link: false          # true = end posts with the article link
  attach_images: true          # attach the article's own picture (feed image or the page's preview image)
  gemini_model: "gemini-flash-latest"   # can be overridden by the GEMINI_MODEL repo variable
  # Tried in order if the main model is overloaded or retired. Check current names at
  # https://aistudio.google.com/docs/models when Google retires a model.
  # A "cerebras:" name is a non-Gemini model on Cerebras, used only when every Gemini model
  # before it is busy. It needs the CEREBRAS_API_KEY secret and is skipped without it.
  # Only qwen can read pictures, so a detail pack with pictures goes straight to it.
  gemini_fallback_models: ["gemini-3.6-flash", "gemini-3.5-flash-lite",
                           "cerebras:gpt-oss-120b", "cerebras:qwen-3.8-27b"]
  # Answers questions with probabilities instead of writing. It is used four times:
  #   1. Triage: scores every new story for importance, adds AI stories the keywords
  #      missed and leaves out keyword matches that are not about AI.
  #   2. Fact check: compares each news draft with its source text.
  #   3. Picture check: leaves out a source picture that tells the reader nothing.
  #   4. Takes judge: facts, clarity, how human each take reads and how your followers
  #      would respond to it. The same request adds a checklist to launch stories.
  # "" turns all four off. If the model fails, the bot carries on as it did without it.
  decision_model: "gemini-decision-1"
  picture_check: true          # false = always attach the source picture
  decision_weight: 0.5         # its 0-3 rating moves a draft up or down the queue by at most this (0 = off)
  # Who follows the account and what they come for. The decision model reads this when it
  # ranks takes by likely response, so the more specific it is, the better the ranking.
  account_profile: |
    An X account that covers AI news for a global audience with a focus on India.
    Followers are developers, founders, students and investors who follow AI closely.
    They respond to concrete numbers, new model releases, Indian AI news and a clear,
    sceptical point of view. They ignore hype and vague commentary.

# The voice Gemini writes in. Edit to match the account.
persona: |
  You write posts for an X account that covers AI news for a global audience
  with a focus on India. Report what happened, plainly and accurately.
  Voice: clear, calm, specific and factual. No opinions, assessments or
  commentary; stick to what the sources say.
  Accuracy and useful explanation beat speed and volume.

# Words that mark a story as AI-related (used only for feeds with ai_only: false).
# Latin keywords use Latin token boundaries (also match AI模型); "AI" is case-sensitive.
# Chinese keywords match within unsegmented text; other keywords are case-insensitive.
keywords:
  - artificial intelligence
  - generative
  - machine learning
  - deep learning
  - neural
  - LLM
  - large language model
  - chatbot
  - OpenAI
  - ChatGPT
  - Anthropic
  - Claude
  - Gemini
  - DeepMind
  - Grok
  - xAI
  - Copilot
  - Llama
  - Mistral
  - DeepSeek
  - Nvidia
  - AGI
  - deepfake
  - Sarvam
  - Krutrim
  - IndiaAI
  - Qwen
  - Kimi
  - Cohere
  - ElevenLabs
  - Bedrock
  - OLMo
  - Molmo
  - LLMs
  # Chinese AI coverage (general Chinese feeds still need relevance filtering).
  - 人工智能
  - 生成式
  - 机器学习
  - 深度学习
  - 神经网络
  - 大模型
  - 智能体
  - 具身智能
  - 自动驾驶
  - 机器人
  - 文生图
  - 文生视频
  - 深度求索
  - 通义千问
  - 智谱
  - 月之暗面
  - 百川智能
  - 商汤
  - 科大讯飞
  - 英伟达

# Feeds. ai_only: true  → the feed is already about AI, take everything.
#        ai_only: false → general tech feed, keep only stories matching keywords.
# Set enabled: false to switch one off. Broken feeds are skipped and logged.
# category: primary / research / policy / news (default). Paper/model types infer their category.
# max_candidates overrides the per-source cap. Discovery priority is not an importance score.
# fetch_summary enriches thin RSS entries from public page metadata AFTER shortlisting.
# prefer_content uses the public full-text feed field when its summary is only a teaser.
# language identifies source text for Gemini; all drafts must be in English.
feeds:
  # Big newspapers (paywalled, but the bot only needs the headline + blurb from RSS)
  - name: The New York Times
    url: https://rss.nytimes.com/services/xml/rss/nyt/Technology.xml
    ai_only: false
    images: true
  - name: The Wall Street Journal
    url: https://feeds.content.dowjones.io/public/rss/RSSWSJD
    ai_only: false
    images: true

  # Global tech press
  - name: The Verge
    url: https://www.theverge.com/rss/ai-artificial-intelligence/index.xml
    ai_only: true
    images: true
  - name: TechCrunch
    url: https://techcrunch.com/category/artificial-intelligence/feed/
    ai_only: true
    images: true
  - name: MIT Technology Review
    url: https://www.technologyreview.com/topic/artificial-intelligence/feed
    ai_only: true
    images: true
  - name: Ars Technica
    url: https://arstechnica.com/ai/feed/
    ai_only: true
    images: true
  - name: Wired
    url: https://www.wired.com/feed/tag/ai/latest/rss
    ai_only: true
    images: true
  - name: VentureBeat
    url: https://venturebeat.com/category/ai/feed/
    ai_only: true
    enabled: false   # blocks GitHub's servers (429 Too Many Requests)
    images: true
  - name: The Decoder
    url: https://the-decoder.com/feed/
    ai_only: true
    images: true
  - name: The Guardian
    url: https://www.theguardian.com/technology/artificialintelligenceai/rss
    ai_only: true
    images: true

  # Business and markets press (paywalled, but RSS headline + blurb is enough)
  - name: Bloomberg
    url: https://feeds.bloomberg.com/technology/news.rss
    ai_only: false
    images: true
  - name: Financial Times
    url: https://www.ft.com/technology?format=rss
    ai_only: false
    images: true
  - name: CNBC
    url: https://www.cnbc.com/id/19854910/device/rss/rss.html
    ai_only: false
    images: true
  - name: Business Insider
    url: https://feeds.businessinsider.com/custom/all
    ai_only: false
    images: true
  - name: The Information      # scoops; paywalled, but the RSS headline + blurb is enough
    url: https://www.theinformation.com/feed
    ai_only: false
    images: true
  - name: South China Morning Post   # China's AI race (DeepSeek, Qwen, Kimi)
    url: https://www.scmp.com/rss/36/feed
    ai_only: false
    images: true
  - name: Tom's Hardware       # chips, GPUs, data centres
    url: https://www.tomshardware.com/feeds/all
    ai_only: false
    images: true

  # Chinese-language reporting. Public RSS checked 9 November 2026.
  # These outlets also carry non-AI stories, so keep keyword filtering enabled.
  - name: QbitAI
    url: https://www.qbitai.com/feed
    language: zh
    category: news
    ai_only: false
    blurb_chars: 700
    fetch_summary: true
    max_candidates: 3
  - name: 36Kr
    url: https://www.36kr.com/feed   # the bare 36kr.com/feed returns HTML
    language: zh
    category: news
    ai_only: false
    blurb_chars: 700
    max_candidates: 3
  - name: LeiPhone
    url: https://www.leiphone.com/feed
    language: zh
    category: news
    ai_only: false
    blurb_chars: 700
    max_candidates: 3

  # Indian press
  - name: The Hindu
    url: https://www.thehindu.com/sci-tech/technology/feeder/default.rss
    ai_only: false
    images: true
  - name: The Indian Express
    url: https://indianexpress.com/section/technology/feed/
    ai_only: false
    enabled: false   # blocks GitHub's servers (403 Forbidden)
    images: true
  - name: Analytics India Magazine
    url: https://analyticsindiamag.com/feed/
    ai_only: false
    images: true
  - name: The Economic Times
    url: https://economictimes.indiatimes.com/tech/rssfeeds/13357270.cms
    ai_only: false
    images: true
  - name: Mint
    url: https://www.livemint.com/rss/technology
    ai_only: false
    images: true
  - name: Inc42
    url: https://inc42.com/feed/
    ai_only: false
    images: true
  - name: YourStory
    url: https://yourstory.com/feed
    ai_only: false
    images: true
  - name: MediaNama
    url: https://www.medianama.com/feed/
    ai_only: false
    images: true
  - name: India Today
    url: https://www.indiatoday.in/rss/1206688
    ai_only: false
    images: true

  # Straight from the labs (often hours ahead of the newspapers).
  # images: true permits a reference picture when attach_images is enabled.
  # Source images are not original artwork or automatically licensed for reuse.
  - name: OpenAI
    category: primary
    max_candidates: 4
    lookback_hours: 48
    url: https://openai.com/news/rss.xml
    fetch_summary: true
    blurb_chars: 800
    ai_only: true
    images: true
  - name: Anthropic          # no RSS feed: the bot reads its news page instead
    category: primary
    max_candidates: 4
    lookback_hours: 48
    type: page_list
    url: https://www.anthropic.com/news
    base: https://www.anthropic.com
    link_pattern: /(?:news/[a-z0-9-]+|claude-[a-z0-9-]+)
    exclude_pattern: /news/(?:announcements|features|product|partnerships|policy|safeguards|security)
    max_new_pages: 12
    ai_only: true
    images: true
  - name: Google DeepMind
    category: primary
    max_candidates: 4
    lookback_hours: 48
    url: https://deepmind.google/blog/rss.xml
    fetch_summary: true
    blurb_chars: 800
    ai_only: true
    images: true
  - name: Google AI Blog
    category: primary
    max_candidates: 4
    lookback_hours: 48
    url: https://blog.google/technology/ai/rss/
    ai_only: true
    images: true
  - name: Hugging Face
    category: primary
    max_candidates: 4
    lookback_hours: 48
    url: https://huggingface.co/blog/feed.xml
    fetch_summary: true
    public_excerpt_class: blog-content  # HF's OG description is often only "A Blog post by..."
    blurb_chars: 800
    ai_only: true
    images: true
  - name: NVIDIA
    category: primary
    max_candidates: 4
    lookback_hours: 48
    url: https://blogs.nvidia.com/feed/
    ai_only: true
    images: true
  - name: Microsoft
    category: primary
    max_candidates: 4
    lookback_hours: 48
    url: https://news.microsoft.com/source/feed/
    ai_only: false
    images: true
  - name: Simon Willison       # fast, reliable notes on new model releases
    category: research
    url: https://simonwillison.net/atom/everything/
    ai_only: false
    images: false              # his posts rarely have a useful picture

  # Research: arXiv papers the community upvoted on Hugging Face Daily Papers.
  # Gemini sees only the abstract. Raise min_upvotes for fewer, bigger papers.
  - name: Hugging Face Papers
    type: hf_papers
    max_candidates: 4
    url: https://huggingface.co/api/daily_papers   # asked for each of the last 3 days by date
    ai_only: true
    min_upvotes: 20       # skip papers with fewer community votes
    max_items: 10         # at most this many papers per run (most upvoted first)
    lookback_hours: 48    # votes build up over a day, so look back further than news
    blurb_chars: 1500     # pass the whole abstract
    images: true          # Hugging Face's preview card for the paper

  # New open models: models from major labs trending on Hugging Face, often the
  # first sign of a release (hours before the press). Gemini reads the model card.
  - name: Hugging Face Models
    type: hf_models
    max_candidates: 4
    url: https://huggingface.co/api/models
    ai_only: true
    max_age_days: 7       # only models created in the last week
    lookback_hours: 168
    max_items: 8
    blurb_chars: 1200
    images: true
    orgs: [openai, google, meta-llama, facebook, microsoft, nvidia, apple, mistralai,
           deepseek-ai, Qwen, moonshotai, zai-org, MiniMaxAI, tencent, baidu, xai-org,
           CohereLabs, allenai, ibm-granite, stabilityai, black-forest-labs, Lightricks,
           sarvamai, ai4bharat, krutrim-ai-labs]

  # Additional direct sources. Date-only publishers get 48 hours, including overnight backlog.
  - name: Mistral
    category: primary
    url: https://mistral.ai/news/rss
    ai_only: true
    max_candidates: 4
    lookback_hours: 48
    images: true
  - name: Meta AI
    category: primary
    url: https://about.fb.com/news/tag/ai/feed/
    ai_only: true
    max_candidates: 4
    lookback_hours: 48
    images: true
  - name: Ai2
    category: primary
    url: https://allenai.org/rss.xml
    ai_only: true
    lookback_hours: 48
    images: true
  - name: Sarvam
    category: primary
    type: page_list
    url: https://www.sarvam.ai/blogs
    base: https://www.sarvam.ai
    link_pattern: /blogs/[a-z0-9-]+
    max_new_pages: 8
    ai_only: true
    max_candidates: 4
    lookback_hours: 48
    images: true
  - name: xAI
    category: primary
    type: page_list
    url: https://x.ai/news
    base: https://x.ai
    link_pattern: /news/[a-z0-9-]+
    max_new_pages: 12
    ai_only: true
    max_candidates: 4
    lookback_hours: 48
    images: true
  - name: Claude Product Updates
    category: primary
    type: page_list
    url: https://claude.com/resources/articles
    base: https://claude.com
    link_pattern: /resources/articles/[a-z0-9-]+
    max_new_pages: 8
    ai_only: true
    lookback_hours: 48
    images: true
  - name: ElevenLabs
    category: primary
    url: https://elevenlabs.io/blog/rss.xml
    ai_only: true
    max_candidates: 2
    lookback_hours: 48
    images: true
  - name: AWS AI
