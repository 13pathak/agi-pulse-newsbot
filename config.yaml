    ai_only: true
    max_candidates: 2           # mostly tutorials and case studies
    lookback_hours: 48
    images: true

  # Independent evaluations and research; public abstracts/excerpts, not vendor claims.
  - name: Epoch AI
    category: research
    url: https://epoch.ai/atom.xml
    ai_only: true
    lookback_hours: 48
    blurb_chars: 800
    fetch_summary: true
    images: true
  - name: Artificial Analysis
    category: research
    type: page_list
    url: https://artificialanalysis.ai/articles
    base: https://artificialanalysis.ai
    link_pattern: /articles/[a-z0-9-]+
    max_new_pages: 8
    ai_only: true
    lookback_hours: 48
    blurb_chars: 800
    images: true
  - name: METR
    category: research
    url: https://metr.org/feed.xml
    ai_only: true
    max_candidates: 2
    lookback_hours: 48
    blurb_chars: 1600           # preserve redaction caveat AND the following findings
    prefer_content: true
    images: false
  - name: Google Research
    category: research
    url: https://research.google/blog/rss/
    ai_only: false
    lookback_hours: 48
    blurb_chars: 800
    images: true
  - name: Microsoft Research
    category: research
    url: https://www.microsoft.com/en-us/research/blog/feed/
    ai_only: false
    lookback_hours: 48
    blurb_chars: 800
    images: true
  - name: Apple ML Research
    category: research
    url: https://machinelearning.apple.com/rss.xml
    ai_only: true
    lookback_hours: 48
    blurb_chars: 800
    images: true

  # Original reporting with distinct engineering, regional and investigative coverage.
