    url: https://spectrum.ieee.org/feeds/topic/artificial-intelligence.rss
    ai_only: true
    images: true
  - name: Rest of World
    url: https://restofworld.org/feed/latest/
    ai_only: false
    prefer_content: true        # summary may be a photo caption
    fetch_summary: true
    images: true
  - name: Entrackr
    url: https://entrackr.com/rss
    ai_only: false
    images: true
  - name: 404 Media AI
    url: https://www.404media.co/tag/ai/rss/
    ai_only: true
    prefer_content: true        # public feed content is more informative than teaser summaries
    fetch_summary: true
    images: true
  - name: SemiAnalysis
    url: https://newsletter.semianalysis.com/feed
    ai_only: false
    prefer_content: true        # uses only the publicly supplied feed excerpt
    fetch_summary: true
    max_candidates: 2
    lookback_hours: 48
    images: true

  # Official policy announcements. The GOV.UK feed is not AISI's full research blog.
