# Practical AI videos: independent from the X-news editorial rules.
settings:
  digest_time_ist: "09:00"
  lookback_days: 14
  discovery_interval_hours: 12
  max_recommendations_per_day: 3
  max_search_calls_per_run: 6
  max_search_calls_per_day: 12
  search_results_per_query: 10
  max_candidates: 45
  max_reviews_per_run: 3
  max_reviews_per_day: 6
  max_screen_calls_per_day: 2
  max_video_minutes_per_day: 120
  min_video_seconds: 60
  max_video_seconds: 2400
  min_score: 65
  min_evidence_score: 6
  retention_days: 30
  gemini_model: "gemini-flash-latest"

categories:
  creative:
    label: "Creative projects"
    queries:
      - "AI animation workflow tutorial"
      - "AI filmmaking practical project walkthrough"
      - "AI image design workflow tutorial"
      - "AI music production workflow tutorial"
  everyday:
    label: "Everyday work & no-code"
    queries:
      - "AI automate everyday work tutorial"
      - "n8n AI workflow practical tutorial"
      - "AI spreadsheet document automation tutorial"
      - "no code AI automation real workflow"
  applications:
    label: "Building AI applications"
    queries:
      - "build AI application step by step demo"
      - "build AI agent real project tutorial"
      - "AI app document search tutorial"
      - "multimodal AI application walkthrough"

# Optional curated channels, using verified channel IDs or public @handles.
# Search discovery works without a channel list and includes small creators.
# Example shape: {handle: "@yourchosencreator", category: "creative"}
channels: []

# Add current model names here; queries rotate through them without treating
# a name or a recent upload as proof that the workflow is new or practical.
model_watchlist: []
